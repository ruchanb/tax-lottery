name: kar_upahar
description: Independent companion app for Nepal's Taxpayer Incentive Gift Programme.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cloud_functions: ^5.5.2
  firebase_app_check: ^0.3.2+5
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5
  firebase_remote_config: ^5.4.3
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.1.2
  nepali_utils: ^3.0.8
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: '#FAF7F0'
  adaptive_icon_foreground: assets/images/app_logo.png
  remove_alpha_ios: true
